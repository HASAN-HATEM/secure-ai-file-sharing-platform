services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securefiles
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  ai:
    environment:
      HF_HOME: ${HF_HOME:-/app/.cache/huggingface}
      TORCH_HOME: ${TORCH_HOME:-/app/.cache/torch}
      MALWARE_MODEL_ID: ${MALWARE_MODEL_ID:-cycloevan/malconv}
      URL_SECURITY_MODEL_ID: ${URL_SECURITY_MODEL_ID:-kmack/malicious-url-detection}
      URL_SECURITY_THRESHOLD: ${URL_SECURITY_THRESHOLD:-0.6}
      TEXT_MODEL_ID: ${TEXT_MODEL_ID:-textattack/bert-base-uncased-ag-news}
      IMAGE_CLASSIFIER_PATH: ${IMAGE_CLASSIFIER_PATH:-}
      FILETYPE_MODEL_PATH: ${FILETYPE_MODEL_PATH:-/app/models/resnet50_filetype_classifier.pt}
      FILETYPE_CLASS_MAPPING_PATH: ${FILETYPE_CLASS_MAPPING_PATH:-/app/models/class_mapping.json}
      FILETYPE_CONFIDENCE_THRESHOLD: ${FILETYPE_CONFIDENCE_THRESHOLD:-0.6}
    build: ./ai
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
      - ai_hf_cache:/app/.cache/huggingface
      - ai_torch_cache:/app/.cache/torch
  web:

    
    build: .
    command: npm run dev
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/securefiles
      JWT_SECRET: devsecret
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SCANNER_SERVICE_URL: ${SCANNER_SERVICE_URL:-http://ai:8000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      FILE_MASTER_KEY_BASE64: ${FILE_MASTER_KEY_BASE64}
      FILE_MASTER_KEY_ID: ${FILE_MASTER_KEY_ID:-master-key-v1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      ALLOWED_MIME: ${ALLOWED_MIME:-application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-word.document.macroEnabled.12,application/vnd.ms-excel.sheet.macroEnabled.12,application/vnd.ms-powerpoint.presentation.macroEnabled.12,application/x-msdownload,text/plain,image/png,image/jpeg,application/octet-stream}
      RESCAN_ON_DOWNLOAD: ${RESCAN_ON_DOWNLOAD:-false};
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM}"
    depends_on:
      - db
      - ai
volumes:
  dbdata:
  ai_hf_cache:
  ai_torch_cache:
